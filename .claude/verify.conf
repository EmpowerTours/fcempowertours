# =============================================================================
# verify.conf — per-repo overrides for .claude/verify.sh
# =============================================================================
# Every line here weakens the gate, so every line must say WHY, and must be
# revisited. Measured 2026-08-25 on this machine; do not re-measure casually.
# =============================================================================

# The production build measured 397s (6m37s) and exits 0 — it is not broken,
# it is slow. The Stop hook's whole budget is 600s, and the rest of the
# verifier needs ~85s, so a 240s cap made the build a guaranteed false RED.
# 480 gives the build real headroom without blowing the hook budget.
STEP_TIMEOUT="${STEP_TIMEOUT:-480}"

# Build is SKIPPED in the in-session stop-gate only, so fix loops stay fast
# (tsc + lint + 267 forge tests run in 42s instead of ~440s).
# claude-director runs this same verifier as its commit gate with
# VERIFY_SKIP_BUILD=0, so the build IS proven before anything is committed.
# Never let this be the only place the build runs.
VERIFY_SKIP_BUILD="${VERIFY_SKIP_BUILD:-1}"

# ---------------------------------------------------------------------------
# Five obsolete forge tests. These are live-mainnet FORK tests that assert a
# chain state which has since intentionally changed. They are not regressions
# and no code fixes them — the chain moved, the assertions did not.
# Verified against chain output 2026-08-25:
#
#   test_TheBurnActuallyReducedSupply       expects V1 supply 22.1M, chain says
#   test_V1SupplyIsBurnedDownAndStaysThere  593.6855 — the burn happened
#                                           2026-08-23 and V1 is fully retired.
#   test_TheOldRewardManagerStaysPaused     expects it to still hold ~19M+;
#                                           it now holds 0, post-burn.
#   test_TheOracleRepointsToV6              assert "should still point at V5
#   test_TheRadioStaysLive...NewRegistry    /V2 BEFORE cutover" — cutover done.
#
# Excluded BY TEST NAME, not by file: --no-match-path on those two files would
# also drop 16 tests that still pass and still mean something.
# Result: 267 passed, 0 failed, ~8s.
#
# TODO: these should be rewritten to assert post-cutover state (or deleted as
# point-in-time migration checks). Until then they are excluded, not ignored.
# Anchors (^...$) do NOT work with forge --no-match-test; leave the regex bare.
# ---------------------------------------------------------------------------
VERIFY_FORGE_ARGS="--no-match-test test_TheOracleRepointsToV6|test_TheRadioStaysLiveAndPointsAtTheNewRegistry|test_TheBurnActuallyReducedSupply|test_TheOldRewardManagerStaysPaused|test_V1SupplyIsBurnedDownAndStaysThere"
